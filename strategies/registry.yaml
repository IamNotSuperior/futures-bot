# Strategy registry - the single machine-readable record of where every idea
# stands. `strategies/registry.py` is the only thing that should write to it,
# and `Registry.promote` is the only way a status changes.
#
# `status` must agree with the entry's heading in research/hypotheses.md.
# `Registry.verify()` checks that and reports any drift; a registry that
# silently disagreed with the log would be worse than no registry at all.
#
# Statuses: proposed -> testing -> paper -> live, with rejected reachable from
# any of them and terminal once reached. The log's standing rule is that a
# verdict is never revised, so nothing promotes out of rejected.

strategies:
  - name: orb
    class_path: orb:OpeningRangeBreakout
    hypothesis_entry: 1
    status: rejected
    verdict_commit: b8e9411
    walkforward_verdict: >-
      REJECTED. -$6,072.81 over 1,409 trades across seven yearly folds,
      3 of 7 profitable, median fold Sharpe -0.585. Under the Lucid limits
      it destroys roughly one evaluation a year; pass probability 7.67%.

